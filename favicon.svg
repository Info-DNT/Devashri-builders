<svg
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="fav-top" x1="5" y1="10" x2="50" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1E3D3" />
      <stop offset="100%" stop-color="#C7A384" />
    </linearGradient>
    <linearGradient id="fav-left" x1="5" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C69C7E" />
      <stop offset="100%" stop-color="#A27A5C" />
    </linearGradient>
    <linearGradient id="fav-right" x1="95" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#966A4D" />
      <stop offset="100%" stop-color="#67442D" />
    </linearGradient>
  </defs>

  {/* Top Facet */}
  <polygon points="5,10 95,10 50,40" fill="url(#fav-top)" />
  {/* Left Facet */}
  <polygon points="5,10 50,40 50,90" fill="url(#fav-left)" />
  {/* Right Facet */}
  <polygon points="95,10 50,40 50,90" fill="url(#fav-right)" />
</svg>
